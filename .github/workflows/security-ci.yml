name: Security and cost guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Runtime dependency and exception-expiry audit
        run: npm run security:audit:runtime
      - name: Finite cost envelope
        run: npm run security:cost-envelope
      - name: Route-policy coverage
        run: npm run security:route-policy
      - name: Environment and smoke-contract governance
        run: |
          npm run security:environment-topology
          npm run security:production-smoke-contract
          node --test scripts/security/validate-environment-topology.test.mjs scripts/security/validate-production-smoke-contract.test.mjs scripts/security/run-bounded-abuse-tests.test.mjs
      - name: Production cost policy
        run: npm run test:production:cost
      - name: Shared production plan policy and deployment fixtures
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/security/production-plan-policy.test.ps1
          pwsh -NoProfile -File ./scripts/security/validate-production-plan.test.ps1
          pwsh -NoProfile -File ./scripts/security/validate-terraform-guardrails.test.ps1
          pwsh -NoProfile -File ./scripts/deployment/production-release.test.ps1
          pwsh -NoProfile -File ./scripts/deployment/production-secret-preflight.test.ps1
          pwsh -NoProfile -File ./scripts/deployment/production-smoke.test.ps1
          pwsh -NoProfile -File ./scripts/deployment/production-deployment-flow.test.ps1
      - name: Build API and web
        run: |
          npm run build:api
          npm run build:web
      - name: Test API and web
        run: |
          npm run test:api
          npm run test:web
      - name: Current surface and reachability
        run: |
          npm run test:current-surface
          npm run test:pruning
          npm run check:web-reachability

  terraform:
    name: Terraform security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Format
        run: terraform fmt -check -recursive
      - name: Initialize without remote state
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-tests
      - name: Test guardrails
        run: terraform test
