openapi: 3.1.0
info:
  title: Atlas Rate-Limit Response Contract
  version: 1.0.0
  description: >-
    Stable public response for edge and application admission rejection. This
    contract does not reveal whether an account, user, session, or resource exists.
paths: {}
components:
  headers:
    RetryAfter:
      description: Positive whole seconds before a bounded retry may be attempted.
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,5}$'
    RequestId:
      description: Bounded correlation identifier when generated by the application.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    RateLimitError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - requestId
        - retryAfterSeconds
      properties:
        error:
          type: string
          enum:
            - RATE_LIMITED
            - QUOTA_EXCEEDED
            - PROTECTION_UNAVAILABLE
            - WORKLOAD_DISABLED
        message:
          type: string
          minLength: 1
          maxLength: 256
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        requestId:
          type: string
          minLength: 1
          maxLength: 128
  responses:
    RateLimited:
      description: Request rejected before the protected work began.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          description: Rejection is not stored by shared caches.
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          examples:
            limited:
              value:
                error: RATE_LIMITED
                message: Request limit reached. Retry later.
                retryAfterSeconds: 60
                requestId: req_example
    ProtectionUnavailable:
      description: Authoritative protection could not safely admit new work.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          examples:
            unavailable:
              value:
                error: PROTECTION_UNAVAILABLE
                message: Protection service is temporarily unavailable.
                retryAfterSeconds: 30
                requestId: req_example
x-atlas-contract:
  statusCodes:
    RATE_LIMITED: 429
    QUOTA_EXCEEDED: 429
    PROTECTION_UNAVAILABLE: 503
    WORKLOAD_DISABLED: 503
  invariants:
    - The response never names the limiting scope or confirms an account exists.
    - Retry-After matches retryAfterSeconds for application responses.
    - Edge WAF may return the fixed RATE_LIMITED body with requestId edge and a conservative fixed Retry-After.
    - CloudFront SPA fallback never rewrites this response.
    - A response is emitted only after tests prove the protected downstream work did not start.
  prohibitedFields:
    - ip
    - email
    - account
    - userId
    - sessionId
    - cookie
    - limit
    - remaining
    - resetTimestamp
    - lockoutUntil
