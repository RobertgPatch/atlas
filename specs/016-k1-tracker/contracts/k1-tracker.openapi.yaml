openapi: 3.1.0
info:
  title: Atlas K1 Tracker API
  version: 0.1.0
  description: Partnership-specific multi-year K-1 basis tracking, import, reconciliation, and sign-off.
servers:
  - url: /v1
security:
  - cookieSession: []
paths:
  /k1-tracker/partnerships:
    get:
      summary: List scoped partnerships with tracker summaries
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TrackerWorkflowStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Scoped partnership tracker summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrackerPartnershipSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /k1-tracker/partnerships/{partnershipId}:
    get:
      summary: Get partnership tracker header, year rail, and latest summary
      parameters:
        - { $ref: '#/components/parameters/PartnershipId' }
      responses:
        '200':
          description: Tracker overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerPartnershipDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /k1-tracker/partnerships/{partnershipId}/years:
    post:
      summary: Create a tracker year
      parameters:
        - { $ref: '#/components/parameters/PartnershipId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taxYear]
              properties:
                taxYear: { type: integer, minimum: 1900, maximum: 2100 }
                expectedPartnershipRevision: { type: integer, minimum: 0 }
                values:
                  type: array
                  items: { $ref: '#/components/schemas/FieldChange' }
      responses:
        '201':
          description: Created and calculated year
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerYearDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /k1-tracker/partnerships/{partnershipId}/years/{taxYear}:
    get:
      summary: Get one selected-year workspace
      parameters:
        - { $ref: '#/components/parameters/PartnershipId' }
        - { $ref: '#/components/parameters/TaxYear' }
      responses:
        '200':
          description: Inputs, provenance, calculations, checks, journal entries, and sign-off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerYearDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Apply field revisions and recalculate this and later years
      parameters:
        - { $ref: '#/components/parameters/PartnershipId' }
        - { $ref: '#/components/parameters/TaxYear' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, changes]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                changes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/FieldChange' }
      responses:
        '200':
          description: Updated year and list of invalidated dependent years
          content:
            application/json:
              schema:
                type: object
                required: [year, invalidatedTaxYears]
                properties:
                  year: { $ref: '#/components/schemas/TrackerYearDetail' }
                  invalidatedTaxYears:
                    type: array
                    items: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete a tracker year after confirmation and recalculate later years
      parameters:
        - { $ref: '#/components/parameters/PartnershipId' }
        - { $ref: '#/components/parameters/TaxYear' }
        - name: expectedRevision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /k1-tracker/partnerships/{partnershipId}/years/{taxYear}/calculate:
    post:
      summary: Calculate a non-persistent draft using existing prior-year context
      parameters:
        - { $ref: '#/components/parameters/PartnershipId' }
        - { $ref: '#/components/parameters/TaxYear' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, changes]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                changes:
                  type: array
                  items: { $ref: '#/components/schemas/FieldChange' }
      responses:
        '200':
          description: Draft authoritative calculations only; no values saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackerCalculation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /k1-tracker/partnerships/{partnershipId}/years/{taxYear}/signoffs:
    post:
      summary: Prepare, review, or explicitly invalidate a tracker-year revision
      parameters:
        - { $ref: '#/components/parameters/PartnershipId' }
        - { $ref: '#/components/parameters/TaxYear' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, action]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                action: { type: string, enum: [PREPARED, REVIEWED, INVALIDATED] }
                reason: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: Updated sign-off state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignoffState' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /k1-tracker/imports/preview:
    post:
      summary: Parse an Excel workbook and stage a non-mutating preview
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                targetPartnershipId: { type: string, format: uuid }
      responses:
        '200':
          description: Detected mappings, years, conflicts, and warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Workbook exceeds configured upload limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /k1-tracker/imports/{importBatchId}/commit:
    post:
      summary: Commit selected preview years atomically
      parameters:
        - name: importBatchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPartnershipId, decisions]
              properties:
                targetPartnershipId: { type: string, format: uuid }
                decisions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sheetName, taxYear, action]
                    properties:
                      sheetName: { type: string }
                      taxYear: { type: integer, minimum: 1900, maximum: 2100 }
                      action: { type: string, enum: [SKIP, MERGE, REPLACE] }
                      expectedRevision: { type: [integer, 'null'], minimum: 1 }
      responses:
        '200':
          description: Atomic import result
          content:
            application/json:
              schema:
                type: object
                required: [importBatchId, partnershipId, importedTaxYears, skippedTaxYears]
                properties:
                  importBatchId: { type: string, format: uuid }
                  partnershipId: { type: string, format: uuid }
                  importedTaxYears:
                    type: array
                    items: { type: integer }
                  skippedTaxYears:
                    type: array
                    items: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: Import preview expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: atlas_session
  parameters:
    PartnershipId:
      name: partnershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaxYear:
      name: taxYear
      in: path
      required: true
      schema: { type: integer, minimum: 1900, maximum: 2100 }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Entity scope or role does not permit the operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Partnership, year, or import batch not found in scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Request or financial validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Stale revision, duplicate year, unresolved source conflict, or failed sign-off gate
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        currentRevision: { type: integer }
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
    Money:
      type: string
      pattern: '^-?[0-9]{1,16}(\.[0-9]{1,2})?$'
      examples: ['1932344.00', '-1067656.00']
    TrackerWorkflowStatus:
      type: string
      enum: [NOT_STARTED, IMPORTED, NEEDS_REVIEW, RECONCILED]
    SourceType:
      type: string
      enum: [FINALIZED_K1, WORKBOOK_IMPORT, MANUAL_ENTRY, MANUAL_OVERRIDE, CARRYFORWARD]
    FieldKey:
      type: string
      enum:
        - opening_outside_basis
        - opening_suspended_loss
        - capital_contributions
        - box_1_ordinary_income_loss
        - box_2_net_rental_real_estate_income_loss
        - box_3_other_net_rental_income_loss
        - box_4c_guaranteed_payments
        - box_5_interest_income
        - box_6a_ordinary_dividends
        - box_7_royalties
        - box_8_net_short_term_capital_gain_loss
        - box_9a_net_long_term_capital_gain_loss
        - box_10_net_section_1231_gain_loss
        - box_11_other_income_loss
        - box_12_section_179_deduction
        - box_13_other_deductions
        - box_18a_nondeductible_expenses
        - box_18b_tax_exempt_income
        - box_19_distributions
        - box_21_foreign_taxes
        - liability_nonrecourse_beginning
        - liability_nonrecourse_ending
        - liability_qualified_nonrecourse_beginning
        - liability_qualified_nonrecourse_ending
        - liability_recourse_beginning
        - liability_recourse_ending
        - section_l_beginning_capital
        - section_l_capital_contributed
        - section_l_current_year_net_income_loss
        - section_l_other_increase_decrease
        - section_l_withdrawals_distributions
        - section_l_ending_capital
        - book_capital_account
        - book_interest_income
        - book_dividend_income
        - book_realized_capital_gain_loss
        - book_other_partnership_income_loss
        - recon_section_704c
        - recon_section_754
        - recon_timing_differences
        - recon_other_permanent_differences
    FieldChange:
      type: object
      required: [fieldKey, amount, sourceType]
      properties:
        fieldKey: { $ref: '#/components/schemas/FieldKey' }
        amount:
          anyOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
        sourceType: { type: string, enum: [MANUAL_ENTRY, MANUAL_OVERRIDE] }
        overrideReason: { type: [string, 'null'], maxLength: 2000 }
    TrackerValue:
      type: object
      required: [id, fieldKey, amount, sourceType, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        fieldKey: { $ref: '#/components/schemas/FieldKey' }
        amount:
          anyOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
        originalSourceText: { type: [string, 'null'] }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        sourceK1DocumentId: { type: [string, 'null'], format: uuid }
        sourceK1FieldValueId: { type: [string, 'null'], format: uuid }
        importBatchId: { type: [string, 'null'], format: uuid }
        sourceSheet: { type: [string, 'null'] }
        sourceCell: { type: [string, 'null'] }
        carryforwardFromTaxYear: { type: [integer, 'null'] }
        overrideReason: { type: [string, 'null'] }
        isActive: { type: boolean }
        createdByEmail: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    TrackerYearSummary:
      type: object
      required: [taxYear, status, revision, warningCount, sourceConflictCount]
      properties:
        taxYear: { type: integer }
        status: { $ref: '#/components/schemas/TrackerWorkflowStatus' }
        revision: { type: integer }
        endingOutsideBasis:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        cumulativeSuspendedLoss:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        taxableExcessDistribution:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        sectionLDifference:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        warningCount: { type: integer, minimum: 0 }
        sourceConflictCount: { type: integer, minimum: 0 }
    TrackerPartnershipSummary:
      type: object
      required: [partnershipId, partnershipName, entityId, entityName, yearCount, latestStatus, warningCount]
      properties:
        partnershipId: { type: string, format: uuid }
        partnershipName: { type: string }
        entityId: { type: string, format: uuid }
        entityName: { type: string }
        yearCount: { type: integer, minimum: 0 }
        firstTaxYear: { type: [integer, 'null'] }
        latestTaxYear: { type: [integer, 'null'] }
        latestStatus:
          anyOf: [{ $ref: '#/components/schemas/TrackerWorkflowStatus' }, { type: 'null' }]
        latestEndingOutsideBasis:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        cumulativeSuspendedLoss:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        warningCount: { type: integer, minimum: 0 }
    TrackerPartnershipDetail:
      allOf:
        - { $ref: '#/components/schemas/TrackerPartnershipSummary' }
        - type: object
          required: [years]
          properties:
            partnerName: { type: [string, 'null'] }
            years:
              type: array
              items: { $ref: '#/components/schemas/TrackerYearSummary' }
    CheckResult:
      type: object
      required: [key, status, message]
      properties:
        key: { type: string }
        status: { type: string, enum: [PASS, WARNING, FAIL, INCOMPLETE] }
        actual:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        expected:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        difference:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        tolerance:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
        message: { type: string }
    JournalEntry:
      type: object
      required: [account, amount, convention]
      properties:
        account: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        convention: { type: string, const: DEBIT_POSITIVE_CREDIT_NEGATIVE }
    TrackerCalculation:
      type: object
      required: [calculationVersion, summary, basis, lossLimitation, distribution, liabilities, sectionL, bookTax, journalEntries, journalBalance, checks]
      properties:
        calculationVersion: { type: string }
        summary: { $ref: '#/components/schemas/TrackerYearSummary' }
        basis: { type: object, additionalProperties: true }
        lossLimitation: { type: object, additionalProperties: true }
        distribution: { type: object, additionalProperties: true }
        liabilities: { type: object, additionalProperties: true }
        sectionL: { type: object, additionalProperties: true }
        bookTax: { type: object, additionalProperties: true }
        journalEntries:
          type: array
          items: { $ref: '#/components/schemas/JournalEntry' }
        journalBalance: { $ref: '#/components/schemas/Money' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/CheckResult' }
    SignoffState:
      type: object
      required: [yearRevision]
      properties:
        yearRevision: { type: integer }
        preparedByEmail: { type: [string, 'null'] }
        preparedAt: { type: [string, 'null'], format: date-time }
        reviewedByEmail: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        invalidatedAt: { type: [string, 'null'], format: date-time }
        invalidationReason: { type: [string, 'null'] }
        history:
          type: array
          items:
            type: object
            required: [action, byEmail, at, reason]
            properties:
              action: { type: string, enum: [PREPARED, REVIEWED, INVALIDATED] }
              byEmail: { type: [string, 'null'] }
              at: { type: string, format: date-time }
              reason: { type: [string, 'null'] }
    TrackerYearDetail:
      type: object
      required: [partnershipId, taxYear, status, revision, values, calculation, signoff]
      properties:
        partnershipId: { type: string, format: uuid }
        taxYear: { type: integer }
        status: { $ref: '#/components/schemas/TrackerWorkflowStatus' }
        revision: { type: integer }
        values:
          type: array
          items: { $ref: '#/components/schemas/TrackerValue' }
        sourceConflicts:
          type: array
          items:
            type: object
            additionalProperties: true
        calculation: { $ref: '#/components/schemas/TrackerCalculation' }
        signoff: { $ref: '#/components/schemas/SignoffState' }
    ImportPreview:
      type: object
      required: [importBatchId, expiresAt, workbookHash, sheets, warnings]
      properties:
        importBatchId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        workbookHash: { type: string }
        proposedPartnershipId: { type: [string, 'null'], format: uuid }
        sheets:
          type: array
          items:
            type: object
            required: [sheetName, proposedPartnershipName, years]
            properties:
              sheetName: { type: string }
              proposedPartnershipName: { type: string }
              proposedPartnershipId: { type: [string, 'null'], format: uuid }
              years:
                type: array
                items:
                  type: object
                  required: [taxYear, state, mappedFieldCount, conflicts, warnings]
                  properties:
                    taxYear: { type: integer }
                    state: { type: string, enum: [POPULATED, FORMULA_ONLY, BLANK, INVALID] }
                    mappedFieldCount: { type: integer }
                    conflicts:
                      type: array
                      items: { type: object, additionalProperties: true }
                    warnings:
                      type: array
                      items: { type: string }
                    values:
                      type: array
                      items:
                        type: object
                        required: [fieldKey, amount, sourceCell]
                        properties:
                          fieldKey: { $ref: '#/components/schemas/FieldKey' }
                          amount:
                            anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
                          sourceCell: { type: string }
        warnings:
          type: array
          items: { type: string }
